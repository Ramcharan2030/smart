name: Keep Alive

on:
  schedule:
    # Runs every 10 minutes to stay well ahead of Render's 15-min sleep timer
    - cron: '*/10 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Services
        run: |
          # Use GET (-L) instead of HEAD (-I) to ensure activity is registered
          # Pinging both Render (Backend) and Vercel (Frontend)
          curl -L https://smart-z85q.onrender.com/
          curl -L https://smart-z85q.onrender.com/api/health
          curl -L https://autosolutions.vercel.app/
